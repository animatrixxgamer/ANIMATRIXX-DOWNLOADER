name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # FFmpeg/FFprobe power the encode stage and the end-to-end pipeline
      # test; the runner has no Telegram credentials, so no secrets are needed.
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m compileall -q app tests

      - name: Run tests
        run: pytest -q

      - name: Config sanity (.env.example must load)
        run: |
          cp .env.example /tmp/ci.env
          sed -i 's/^BOT_TOKEN=$/BOT_TOKEN=123456789:CIplaceholderplaceholderplaceholder/; s/^OWNER_ID=0$/OWNER_ID=1/' /tmp/ci.env
          python -c "
          import os
          from app.config import Settings
          os.environ.pop('BOT_TOKEN', None)
          s = Settings(_env_file='/tmp/ci.env')
          assert s.default_encoding_profile in {'original','high','balanced','small','target'}
          print('env ok:', s.default_output_format, sorted(s.allowed_ports), s.upload_limit_mb)
          "